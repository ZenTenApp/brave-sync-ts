name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    needs: ci
    runs-on: ubuntu-latest
    concurrency:
      group: dist-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci
      - run: npm run build:proto
      - run: npm run build

      # Keep dist branch current on every main push (even when semantic-release skips).
      - name: Publish to dist branch
        env:
          GITHUB_OUTPUT: /tmp/publish-dist-output
        run: bash scripts/publish-dist.sh

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
